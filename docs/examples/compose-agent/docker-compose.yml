services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    depends_on:
      - helper
  helper:
    build:
      context: ./agent
      dockerfile: Dockerfile
    command: ["python", "-m", "http.server", "8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090')"]
