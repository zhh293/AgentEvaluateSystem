apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: agent-eval }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.59
          env: [{ name: COLLECTOR_OTLP_ENABLED, value: "true" }]
          ports: [{ name: otlp, containerPort: 4317 }, { name: ui, containerPort: 16686 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: jaeger, namespace: agent-eval }
spec: { selector: { app: jaeger }, ports: [{ name: otlp, port: 4317 }, { name: ui, port: 16686 }] }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: agent-eval }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: backend
        metrics_path: /metrics
        static_configs:
          - targets: [backend:8000]
  alerts.yml: |
    groups:
      - name: agent-eval
        rules:
          - alert: BackendUnavailable
            expr: up{job="backend"} == 0
            for: 2m
            labels: { severity: critical }
            annotations: { summary: "Agent evaluation backend is unavailable" }
          - alert: HighServerErrorRate
            expr: sum(rate(agent_eval_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(agent_eval_http_requests_total[5m])), 0.001) > 0.05
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "Backend 5xx rate exceeds 5%" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: agent-eval }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{ containerPort: 9090 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }, { name: data, mountPath: /prometheus }]
      volumes: [{ name: config, configMap: { name: prometheus-config } }, { name: data, emptyDir: { sizeLimit: 5Gi } }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: agent-eval }
spec: { selector: { app: prometheus }, ports: [{ port: 9090 }] }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-provisioning, namespace: agent-eval }
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: agent-eval }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: agent-eval-secrets, key: GRAFANA_ADMIN_PASSWORD, optional: true } } }
          ports: [{ containerPort: 3000 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts: [{ name: provisioning, mountPath: /etc/grafana/provisioning/datasources }]
      volumes: [{ name: provisioning, configMap: { name: grafana-provisioning } }]
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: agent-eval }
spec: { selector: { app: grafana }, ports: [{ port: 3000 }] }
