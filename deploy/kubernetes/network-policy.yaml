apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sandbox-daemon-ingress, namespace: agent-eval }
spec:
  podSelector: { matchLabels: { app: sandbox-daemon } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: worker } } }]
      ports: [{ protocol: TCP, port: 2375 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: database-ingress, namespace: agent-eval }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [postgres, redis, rabbitmq, minio] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [backend, worker, prometheus, grafana] }
