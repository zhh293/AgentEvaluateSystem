name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - run: pytest backend/tests -q --cov=backend/app --cov-report=term-missing
      - run: bandit -r backend/app -q -lll -x backend/app/data
      - run: pip-audit -r backend/requirements.txt --progress-spinner off
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    permissions: { contents: read, packages: write }
    runs-on: ubuntu-latest
    strategy: { matrix: { component: [backend, frontend] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: "./${{ matrix.component }}", push: true, tags: "ghcr.io/${{ github.repository_owner }}/agent-eval-${{ matrix.component }}:${{ github.sha }}" }
  sandbox-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    permissions: { contents: read, packages: write }
    runs-on: ubuntu-latest
    strategy: { matrix: { profile: [readonly, writable, highrisk] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ./sandbox
          file: ./sandbox/Dockerfile.${{ matrix.profile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agent-eval-sandbox:${{ matrix.profile }}
