apiVersion: apps/v1
kind: DaemonSet
metadata: { name: sandbox-daemon, namespace: agent-eval }
spec:
  selector: { matchLabels: { app: sandbox-daemon } }
  template:
    metadata: { labels: { app: sandbox-daemon } }
    spec:
      nodeSelector: { workload: agent-sandbox }
      tolerations: [{ key: workload, operator: Equal, value: agent-sandbox, effect: NoSchedule }]
      containers:
        - name: docker
          image: docker:27-dind
          args: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
          env: [{ name: DOCKER_TLS_CERTDIR, value: "" }]
          ports: [{ name: docker, containerPort: 2375 }]
          securityContext: { privileged: true }
          resources: { requests: { cpu: "1", memory: 2Gi }, limits: { cpu: "4", memory: 8Gi } }
          volumeMounts: [{ name: docker-data, mountPath: /var/lib/docker }]
      volumes: [{ name: docker-data, emptyDir: { sizeLimit: 50Gi } }]
---
apiVersion: v1
kind: Service
metadata: { name: sandbox-daemon, namespace: agent-eval }
spec: { selector: { app: sandbox-daemon }, ports: [{ name: docker, port: 2375, targetPort: 2375 }] }
