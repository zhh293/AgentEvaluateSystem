apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: agent-eval }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env: [{ name: POSTGRES_DB, value: agent_eval }, { name: POSTGRES_USER, value: agent_eval }, { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: agent-eval-secrets, key: POSTGRES_PASSWORD } } }]
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates: [{ metadata: { name: data }, spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: agent-eval }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: agent-eval }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: redis-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: agent-eval }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: redis-data, namespace: agent-eval }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: agent-eval }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports: [{ containerPort: 5672 }]
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: agent-eval }
            - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: agent-eval-secrets, key: RABBITMQ_PASSWORD } } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: rabbitmq-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: agent-eval }
spec: { selector: { app: rabbitmq }, ports: [{ port: 5672 }] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: rabbitmq-data, namespace: agent-eval }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: agent-eval }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-08-17T01-24-54Z
          args: [server, /data]
          ports: [{ containerPort: 9000 }]
          env: [{ name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: agent-eval-secrets, key: MINIO_ACCESS_KEY } } }, { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: agent-eval-secrets, key: MINIO_SECRET_KEY } } }]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: 9000 }, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: minio-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: agent-eval }
spec: { selector: { app: minio }, ports: [{ port: 9000 }] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data, namespace: agent-eval }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 50Gi } } }
