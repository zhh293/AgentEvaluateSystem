# Example only. In production, create this Secret with External Secrets,
# Sealed Secrets, or your cloud secret manager; never commit real values.
apiVersion: v1
kind: Secret
metadata: { name: agent-eval-secrets, namespace: agent-eval }
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://agent_eval:REPLACE_ME@postgres:5432/agent_eval
  RABBITMQ_URL: amqp://agent-eval:REPLACE_ME@rabbitmq:5672//
  JWT_SECRET_KEY: REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES
  MINIO_ACCESS_KEY: REPLACE_ME
  MINIO_SECRET_KEY: REPLACE_ME
  JUDGE_API_KEY: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  RABBITMQ_PASSWORD: REPLACE_ME
  GRAFANA_ADMIN_PASSWORD: REPLACE_ME
